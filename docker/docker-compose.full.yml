services:
  # Base de datos PostgreSQL con PostGIS y pgRouting
  db:
    image: postgis/postgis:17-3.5
    container_name: ruteo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruteo
    ports:
      - "5432:5432"
    volumes:
      - ruteo_pgdata:/var/lib/postgresql/data
      - ../backup_supabase.dump:/backup.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruteo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicacion web Next.js
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: ruteo_web
    ports:
      - "3000:3000"
    environment:
      - SUPABASE_DB_HOST=db
      - SUPABASE_DB_PORT=5432
      - SUPABASE_DB_NAME=ruteo
      - SUPABASE_DB_USER=postgres
      - SUPABASE_DB_PASSWORD=postgres
      - NODE_ENV=development
      - PYTHONPATH=/cplex
      - OPTIMIZATION_PATH=/app/optimization
    volumes:
      - /home/faros/.local/lib/python3.10/site-packages/cplex:/cplex/cplex:ro
      - /home/faros/.local/lib/python3.10/site-packages/docplex:/cplex/docplex:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ruteo_pgdata:
