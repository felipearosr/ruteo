version: '3.8'
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: ruteo_app
    # Montar el repositorio para desarrollo y para que main.py pueda encontrar archivos generados
    volumes:
      - ..:/app:delegated
    environment:
      # Variables para conectar a Supabase / PostgreSQL (NO poner secretos aquí en el repo)
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - SUPABASE_DB_HOST
      - SUPABASE_DB_PORT
      - SUPABASE_DB_NAME
      - SUPABASE_DB_USER
      - SUPABASE_DB_PASSWORD
      # Variables para Next.js (cliente web)
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Licencia GUROBI (opcional). Monte el archivo de licencia en /opt/gurobi/gurobi.lic
      - GUROBI_LICENSE_FILE=${GUROBI_LICENSE_FILE:-/opt/gurobi/gurobi.lic}
      - GRB_LICENSE_FILE=${GRB_LICENSE_FILE:-/opt/gurobi/gurobi.lic}
      # Configuraciones de runtime opcionales
      - PYTHONUNBUFFERED=1
      - NODE_ENV=development
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Mantener el usuario root por simplicidad; en producción considerar usar un usuario no privilegiado
