services:
  db:
    image: pgrouting/pgrouting:17-3.5-3.8
    container_name: ruteo_local_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruteo
    ports:
      - "5432:5432"
    volumes:
      - ruteo_pgdata:/var/lib/postgresql/data
      - ../backup_supabase.dump:/backup.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruteo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ruteo_pgdata:
